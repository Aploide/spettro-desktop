name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

# A second push to the same branch makes the first run's answer irrelevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    # Windows is a real target, not an afterthought — the CLI is located by a
    # different search path there, sessions are stored under a different
    # userData root, and paths that only ever get joined on Linux have a way of
    # working right up until they do not. The suite is fast enough that running
    # it on both costs nothing worth saving.
    name: Typecheck + test / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # `npm ci`, not `npm install`: CI must fail on a lockfile that has
      # drifted rather than quietly resolving something else.
      - name: Install dependencies
        run: npm ci

      # Covers tsconfig.node, tsconfig.web and tsconfig.test — so a test that
      # stops compiling against the code it tests fails here too.
      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

  build:
    # Typechecking is not the same as building: electron-vite resolves aliases,
    # bundles the preload, and inlines CSS, and any of those can break while
    # `tsc` stays happy.
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  visual:
    # Renders the orchestration views offscreen and uploads the screenshots, so
    # a change to the workflow card or the swarm grid can be *looked at* on the
    # pull request instead of being reviewed as a CSS diff. These views are
    # about what twenty rows landing at once look like; that does not survive
    # code review.
    #
    # Deliberately non-blocking: screenshots are a review aid, not a
    # correctness gate, and this is the one job with a moving part outside the
    # repo. Electron 43 has no postinstall — it exposes its downloader as a bin
    # instead — so `npm ci` does not fetch the ~100MB runtime and shoot.sh
    # fetches it on demand. A slow or unavailable release mirror should cost a
    # screenshot, not a merge. (Offscreen rendering itself needs no display
    # server, which is the whole reason capture.cjs uses it.)
    name: Screenshots
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The libraries Chromium links against. Present on most runner images
      # already; installing them explicitly means this job does not silently
      # depend on what else happened to be baked in.
      # libasound2 was renamed libasound2t64 in Ubuntu 24.04, so the package
      # list is not portable across runner images. Each one is installed
      # best-effort: a missing audio library does not stop an offscreen render,
      # and pinning the whole job to one image version would age worse.
      - name: Install Electron's runtime libraries
        run: |
          sudo apt-get update
          for pkg in libnss3 libatk1.0-0t64 libatk1.0-0 libatk-bridge2.0-0t64 \
                     libatk-bridge2.0-0 libcups2t64 libcups2 libdrm2 libgbm1 \
                     libgtk-3-0t64 libgtk-3-0 libasound2t64 libasound2 \
                     libxkbcommon0 libxdamage1 libxrandr2 libxcomposite1 libxfixes3; do
            sudo apt-get install -y --no-install-recommends "$pkg" || true
          done

      # The same command a maintainer runs locally, so the artifacts on a pull
      # request and the PNGs on someone's laptop cannot quietly disagree.
      - name: Shoot every scene, both schemes
        run: npm run visual

      - uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.sha }}
          path: .visual-shots/
          if-no-files-found: error
