appId: app.spettro.desktop
productName: Spettro
directories:
  buildResources: build
  output: release
files:
  - out/**
  - package.json
asarUnpack:
  - '**/node_modules/node-pty/**'
extraResources:
  - from: build/icon.png
    to: icon.png
# node-pty is the only native dependency and it is an N-API (node-addon-api)
# module shipping its own prebuilds for win32-x64, win32-arm64 and darwin-*.
# N-API is ABI-stable across Node and Electron, so those prebuilds load in
# Electron as-is — rebuilding them would only force an MSVC toolchain onto
# every Windows build machine for no gain. Linux has no prebuilds, so there
# node-pty still compiles from source via its own install script during
# `npm install` (gcc is present on the Linux runners).
npmRebuild: false
linux:
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
  category: Development
  icon: build/icon.png
  artifactName: Spettro-${version}-linux-${arch}.${ext}
win:
  target:
    - target: nsis
      arch:
        - x64
        - arm64
    - target: msi
      arch:
        - x64
        - arm64
  icon: build/icon.ico
  artifactName: Spettro-${version}-win-${arch}.${ext}
# No Developer ID is configured, so the app is ad-hoc signed — arm64 refuses
# to launch an unsigned binary at all, and electron-builder skips signing
# rather than falling back to ad-hoc unless told to. Hardened runtime is off
# because, under an ad-hoc signature, its library validation rejects the
# Electron frameworks (they carry Electron's Team ID); it only buys anything
# for notarization, which needs a real certificate anyway. Gatekeeper still
# quarantines the download on first open. The zip sits next to the dmg
# because it is what latest-mac.yml points at — a dmg cannot be applied as
# an update.
mac:
  identity: '-'
  hardenedRuntime: false
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64
  category: public.app-category.developer-tools
  icon: build/icon.png
  artifactName: Spettro-${version}-mac-${arch}.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: Spettro-Setup-${version}-${arch}.${ext}
msi:
  artifactName: Spettro-${version}-win-${arch}.${ext}
publish:
  provider: github
  releaseType: release
